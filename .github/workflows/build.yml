name: build

on:
  push:
    branches: [arena/72bfde82-222]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 1.1.1
  OPENVPN_MSI: https://swupdate.openvpn.org/community/releases/OpenVPN-2.6.12-I001-amd64.msi
  TAP_INSTALLER: https://build.openvpn.net/downloads/releases/tap-windows-9.24.7-I601-Win10.exe

jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: fetch engine binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force engine\drivers, engine\_msi | Out-Null
          Invoke-WebRequest -Uri $env:OPENVPN_MSI -OutFile engine\_msi\openvpn.msi -UseBasicParsing
          Start-Process msiexec.exe -Wait -ArgumentList "/a `"$PWD\engine\_msi\openvpn.msi`" /qn TARGETDIR=`"$PWD\engine\_msi\x`""
          Copy-Item engine\_msi\x\OpenVPN\bin\* engine\ -Include *.exe,*.dll

          Invoke-WebRequest -Uri $env:TAP_INSTALLER -OutFile engine\drivers\tap-windows-installer.exe -UseBasicParsing
          Remove-Item -Recurse -Force engine\_msi
          Get-ChildItem engine | Format-Table Name,Length

      - name: fetch smoke sample
        shell: pwsh
        run: ./ci/smoke-servers.ps1

      - name: build app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci | Out-Null
          dotnet build engine\EndorVPN\EndorVPN.csproj -c Release /p:Platform=x64 *>&1 | Tee-Object -FilePath ci/build-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: assemble portable folder
        shell: pwsh
        run: |
          $dist = "dist\EndorVPN"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item engine\EndorVPN\bin\x64\Release\net48\EndorVPN.exe $dist
          $eng = Join-Path $dist "engine"
          New-Item -ItemType Directory -Force $eng, (Join-Path $eng "drivers") | Out-Null
          Copy-Item engine\*.exe, engine\*.dll $eng -ErrorAction SilentlyContinue
          Copy-Item engine\drivers\tap-windows-installer.exe (Join-Path $eng "drivers")
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md $dist -ErrorAction SilentlyContinue
          Write-Host "--- portable layout ---"
          Get-ChildItem $dist -Recurse -File | ForEach-Object { Write-Host ($_.FullName.Replace($PWD.Path + "\", "") + "  " + [math]::Round($_.Length/1KB,1) + " KB") }

      - name: verify engine bundle
        shell: pwsh
        run: |
          $eng = "dist\EndorVPN\engine"
          $required = @("openvpn.exe","tapctl.exe","libpkcs11-helper-1.dll","libcrypto-3-x64.dll","libssl-3-x64.dll","vcruntime140.dll","drivers\tap-windows-installer.exe")
          $missing = @()
          foreach ($r in $required) { if (-not (Test-Path (Join-Path $eng $r))) { $missing += $r } }
          Write-Host "engine files:"; Get-ChildItem $eng -Recurse -File | ForEach-Object { Write-Host ("  " + $_.Name) }
          if ($missing.Count -gt 0) {
            Set-Content -Path ci/verify-output.txt -Value ("missing: " + ($missing -join ", ") + "`n" + ((Get-ChildItem $eng -Recurse -File | ForEach-Object { $_.Name }) -join "`n"))
            throw ("missing engine files: " + ($missing -join ", "))
          }
          # openvpn must at least start and print its version (DLL resolution check)
          $out = & (Join-Path $eng "openvpn.exe") --version 2>&1
          Write-Host ($out -join " | ")
          if (-not ($out -match "OpenVPN 2")) { throw "openvpn.exe failed to start - missing dependencies" }

      - name: smoke test
        shell: pwsh
        run: |
          ./ci/smoke-servers.ps1
          Copy-Item engine\EndorVPN\smoke-servers.csv dist\EndorVPN\smoke-servers.csv -Force
          $p = Start-Process dist\EndorVPN\EndorVPN.exe -ArgumentList '--smoke-test' -Wait -PassThru -NoNewWindow
          Write-Host "smoke exit=$($p.ExitCode)"
          if (Test-Path dist\EndorVPN\data\smoke-report.txt) { Get-Content dist\EndorVPN\data\smoke-report.txt | ForEach-Object { Write-Host $_ } }
          if (Test-Path dist\EndorVPN\data\endorvpn.log) { Write-Host "---- app log ----"; Get-Content dist\EndorVPN\data\endorvpn.log | Select-Object -Last 40 | ForEach-Object { Write-Host $_ } }
          New-Item -ItemType Directory -Force ci | Out-Null
          $report = if (Test-Path dist\EndorVPN\data\smoke-report.txt) { Get-Content dist\EndorVPN\data\smoke-report.txt -Raw } else { "no report" }
          $appLog = if (Test-Path dist\EndorVPN\data\endorvpn.log) { Get-Content dist\EndorVPN\data\endorvpn.log -Raw } else { "no log" }
          Set-Content -Path ci/smoke-output.txt -Value ("exit=" + $p.ExitCode + "`n" + $report + "`n---- log ----`n" + $appLog) -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "smoke test failed" }

      - name: e2e tunnel test
        shell: pwsh
        continue-on-error: true
        run: ./ci/e2e-connect.ps1 -Exe dist\EndorVPN\EndorVPN.exe -Report ci\reports\e2e.json

      - name: ui screenshots
        shell: pwsh
        continue-on-error: true
        run: ./ci/screenshot.ps1 -Exe dist\EndorVPN\EndorVPN.exe -OutDir ci/reports

      - name: single-file exe
        shell: pwsh
        continue-on-error: true
        run: |
          Start-Transcript -Path ci/sfx-output.txt -Force | Out-Null
          Get-Process EndorVPN -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process openvpn -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          dotnet build setup\Setup.csproj -c Release /p:Platform=x64 -v minimal *>&1 | Tee-Object -FilePath ci/sfx-build.txt
          Write-Host "---- stub build output ----"
          if (Test-Path ci/sfx-build.txt) { Get-Content ci/sfx-build.txt | Select-Object -Last 30 | ForEach-Object { Write-Host $_ } }
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path setup\bin\x64\Release\net48\EndorVPN-Setup.exe)) { throw "stub build failed" }
          ./setup/pack-sfx.ps1 -Stub setup\bin\x64\Release\net48\EndorVPN-Setup.exe -AppDir dist\EndorVPN -Out dist\EndorVPN.exe
          if (-not (Test-Path dist\EndorVPN.exe)) { throw "single-file build failed" }
          Write-Host "single exe: $([math]::Round((Get-Item dist\EndorVPN.exe).Length/1MB,2)) MB"

          # Smoke-test the real distributable: run it and expect it to unpack and
          # launch the UI. This is the exact file users download.
          $installDir = Join-Path $env:LOCALAPPDATA "EndorVPN"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue }
          $p = Start-Process dist\EndorVPN.exe -PassThru
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline -and -not (Test-Path (Join-Path $installDir "payload.version"))) { Start-Sleep -Milliseconds 500 }
          $unpacked = Test-Path (Join-Path $installDir "EndorVPN.exe")
          $engineOk = Test-Path (Join-Path $installDir "engine\openvpn.exe")
          Write-Host "sfx unpack: exe=$unpacked engine=$engineOk"
          Get-Process EndorVPN, 'EndorVPN-Setup' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $unpacked -or -not $engineOk) { throw "single-file exe failed to unpack" }
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem dist -Filter *.exe | Format-Table Name,Length
          Stop-Transcript | Out-Null

      - name: package zip
        shell: pwsh
        continue-on-error: true
        run: |
          Start-Transcript -Path ci/zip-output.txt -Force | Out-Null
          # the screenshot run may still hold the exe open; make sure it is gone
          Get-Process EndorVPN -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $zip = "dist\EndorVPN-win64.zip"
          # a shipped build must not contain runtime state: logs, cache, settings
          Get-Process openvpn -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          foreach ($stale in @("dist\EndorVPN\data\work\openvpn.log", "dist\EndorVPN\data\work\active.ovpn", "dist\EndorVPN\data\work\auth.txt", "dist\EndorVPN\data\endorvpn.log", "dist\EndorVPN\data\ui-ready.txt")) {
            if (Test-Path $stale) { try { Remove-Item $stale -Force -ErrorAction Stop } catch { Write-Host "cannot remove $stale : $($_.Exception.Message)" } }
          }
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            try {
              if (Test-Path $zip) { Remove-Item $zip -Force -ErrorAction Stop }
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path "dist\EndorVPN").Path, (Join-Path (Resolve-Path "dist").Path "EndorVPN-win64.zip"), [System.IO.Compression.CompressionLevel]::Optimal, $true)
              $ok = $true
              break
            } catch {
              Write-Host "zip attempt ${i} failed: $($_.Exception.Message)"
              Start-Sleep -Seconds 5
            }
          }
          if (-not $ok) { throw "could not create zip" }
          Get-ChildItem dist | Format-Table Name,Length
          Get-ChildItem dist\EndorVPN -Recurse | Measure-Object Length -Sum | ForEach-Object { Write-Host "folder bytes: $($_.Sum)" }
          Write-Host "zip bytes: $((Get-Item dist\EndorVPN-win64.zip).Length)"
          Stop-Transcript | Out-Null

      - uses: actions/upload-artifact@v4
        with:
          name: EndorVPN-win64
          path: |
            dist/EndorVPN/**
            dist/EndorVPN-win64.zip
            dist/EndorVPN.exe
            ci/reports/*.png
          if-no-files-found: error

      - name: publish release
        shell: pwsh
        run: |
          if (-not (Test-Path dist\EndorVPN-win64.zip)) { Write-Host "no zip - skipping release"; exit 0 }
          $tag = "v$env:VERSION"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag exists - updating assets"
            gh release upload $tag dist\EndorVPN-win64.zip --clobber
            if (Test-Path dist\EndorVPN.exe) { gh release upload $tag dist\EndorVPN.exe --clobber }
          } else {
            $notes = @"
          EndorVPN $env:VERSION - бесплатный VPN-клиент для Windows (RU/EN).

          **Скачать:** ``EndorVPN.exe`` - один файл, ничего распаковывать не нужно.

          **Как пользоваться**
          1. Запустите ``EndorVPN.exe`` и подтвердите запрос администратора (нужен сетевой драйвер и доступ к таблице маршрутов).
          2. При первом запуске файл распакуется в ``%LOCALAPPDATA%\EndorVPN`` (около секунды), дальше приложение стартует сразу.
          3. Выберите страну и нажмите большую кнопку. TAP-драйвер установится сам.

          **Что нового в $env:VERSION**
          - Исправлен ``installer payload offset mismatch``: установщик в одном файле теперь корректно распаковывается.
          - Список стран больше не оставался пустым: загрузка шла из фонового потока, минуя UI-поток.
          - Подключение стало быстрым: мгновенный выход при AUTH_FAILED и автоматический переход на VPNBook, если узел VPN Gate не пускает.
          - Стабильные узлы VPNBook пробуются первыми, VPN Gate остаётся для широкого покрытия стран.
          - Публичный IP определяется параллельно с загрузкой списка, а не после неё.
          - Самая быстрая страна выбирается автоматически, кнопка сразу готова к подключению.
          - Упаковка: ``EndorVPN.exe`` - самодостаточный файл; портативный вариант в ``EndorVPN-win64.zip``.

          **English**: run the single ``EndorVPN.exe``, confirm UAC, pick a country, press the big button. No installer, no separate drivers.

          В сборку входят: OpenVPN 2.6 (GPLv2), TAP-Windows6 (GPLv2), флаги lipis/flag-icons (MIT).
          "@
            gh release create $tag dist\EndorVPN-win64.zip dist\EndorVPN.exe --title "EndorVPN $env:VERSION" --notes $notes
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: commit binary to repo
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          git config user.email "ci@endorvpn.local"
          git config user.name "EndorVPN CI"
          # Binaries are published as release assets; git history stays source-only.
          Write-Host "release assets are published above; skipping binary commit"

      - name: publish build log to repo
        if: always()
        shell: pwsh
        run: |
          git config user.email "ci@endorvpn.local"
          git config user.name "EndorVPN CI"
          if (Test-Path ci/build-output.txt) { git add -f ci/build-output.txt }
          if (Test-Path ci/smoke-output.txt) { git add -f ci/smoke-output.txt }
          if (Test-Path ci/verify-output.txt) { git add -f ci/verify-output.txt }
          if (Test-Path ci/zip-output.txt) { git add -f ci/zip-output.txt }
          if (Test-Path ci/sfx-output.txt) { git add -f ci/sfx-output.txt }
          if (Test-Path ci/sfx-build.txt) { git add -f ci/sfx-build.txt }
          if (Test-Path ci/reports/e2e.json) { git add -f ci/reports/e2e.json }
          Get-ChildItem ci\reports\*.* -ErrorAction SilentlyContinue | ForEach-Object { git add -f $_.FullName.Replace($PWD.Path + "\", "").Replace("\", "/") }
          git commit -m "ci: build output" | Out-Null
          git pull --rebase origin arena/72bfde82-222 2>&1 | Out-Null
          git push origin HEAD:arena/72bfde82-222 2>&1 | Out-Null
