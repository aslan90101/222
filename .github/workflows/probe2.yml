name: probe2
on:
  push:
    branches: [arena/72bfde82-222]
    paths: ['.github/workflows/probe2.yml']
  workflow_dispatch:
jobs:
  p:
    runs-on: windows-latest
    steps:
      - name: make artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          [System.IO.File]::WriteAllBytes("out/blob.bin", (New-Object byte[] 3000000))
          "hello from windows" | Out-File -Encoding utf8 out/hello.txt
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: probe-art
          path: out/*
