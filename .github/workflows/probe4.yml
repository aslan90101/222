name: probe4
on:
  push:
    branches: [arena/72bfde82-222]
    paths: ['ci/probe10.ps1', '.github/workflows/probe4.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vpnbook:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: run probe
        shell: pwsh
        run: ./ci/probe10.ps1
        continue-on-error: true
      - name: push report
        shell: pwsh
        run: |
          git config user.email "ci@endorvpn.local"; git config user.name "EndorVPN CI"
          git add -A ci/reports; git commit -m "ci: probe10 report" | Out-Null
          git pull --rebase origin arena/72bfde82-222; git push origin HEAD:arena/72bfde82-222
  wpf:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: check
        shell: pwsh
        run: |
          Write-Host "dotnet framework refs:"; Get-ChildItem 'C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework' -EA SilentlyContinue | Select-Object -ExpandProperty Name
          Write-Host "MSBuild WPF targets:"; Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -Recurse -Filter 'Microsoft.WinFX.targets' -EA SilentlyContinue | Select-Object -First 3 -ExpandProperty FullName
          Write-Host "VERSION: $((Get-Content env:GITHUB_WORKSPACE/.github/workflows/probe4.yml -Raw).Length)"
