name: probe4
on:
  push:
    branches: [arena/72bfde82-222]
    paths: ['ci/probe7.ps1', '.github/workflows/probe4.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: run probe
        shell: pwsh
        run: ./ci/probe7.ps1
        continue-on-error: true
      - name: push report
        shell: pwsh
        run: |
          git config user.email "ci@endorvpn.local"
          git config user.name "EndorVPN CI"
          git add -A ci/reports
          git commit -m "ci: probe7 report" | Out-Null
          git pull --rebase origin arena/72bfde82-222
          git push origin HEAD:arena/72bfde82-222
