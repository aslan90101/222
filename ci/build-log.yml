name: buildlog
on:
  workflow_run:
    workflows: [build]
    types: [completed]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: get logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run view ${{ github.event.workflow_run.id }} --log > build-log.txt 2>&1 || true
          head -c 200000 build-log.txt
          git config user.email ci@endorvpn.local
          git config user.name CI
          git add build-log.txt
          git commit -m "ci: build log" || true
          git pull --rebase origin arena/72bfde82-222 || true
          git push origin HEAD:arena/72bfde82-222 || true
